name: Build Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --uac-admin --name WiFiFixer wifi_fixer.py
      - uses: actions/upload-artifact@v4
        with:
          name: WiFiFixer-windows
          path: dist/WiFiFixer.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WiFi Fixer (latest build)
          body: Download WiFiFixer.exe below and double-click it.
          files: dist/WiFiFixer.exe
